<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEGOCIA · El arte de negociar</title>
  <meta name="description" content="Serious game para entrenar a directivos en negociación y toma de decisiones bajo presión: prepara, negocia contra personajes con intereses ocultos y aprende de tus sesgos.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M8 16 L30 32 L8 48 L8 38 L17 32 L8 26 Z' fill='%23f2b84b'/%3E%3Cpath d='M56 16 L34 32 L56 48 L56 38 L47 32 L56 26 Z' fill='%233cc6b0'/%3E%3C/svg%3E">

<body>
  <a class="saltar-contenido" href="#pantalla">Saltar al contenido</a>
  <div id="app" class="app">

      <div id="barra-titulo" class="barra-titulo"></div>
      <div class="barra-acciones">

        <button type="button" id="btn-sonido" class="btn-icono" aria-pressed="true" aria-label="Silenciar el sonido"></button>
        <button type="button" id="btn-ajustes" class="btn-icono" aria-label="Ajustes"></button>
      </div>
    </header>
    <main id="pantalla" class="pantalla" tabindex="-1"></main>
  </div>
  <div id="capa-modal" class="capa-modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="anunciador" class="solo-lectores" aria-live="polite" aria-atomic="true"></div>
  <noscript><p style="padding:24px">NEGOCIA necesita JavaScript para funcionar.</p></noscript>

  <script src="js/datos/escenarios/e5-multiparte.js"></script>
  <script src="js/nucleo/preparacion.js"></script>
  <script src="js/nucleo/motor.js"></script>
  <script src="js/nucleo/sesgos.js"></script>

  <script src="js/ui/app.js"></script>
  <script src="js/ui/ajustes.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/tutorial.js"></script>
